# Presentation: visuals, camera, animation, UI, audio and overlays.
#
# This is the only layer allowed to see the full engine. It depends on the
# domain to read authoritative state, and NOT on the simulation: it consumes
# state and facts, never systems or rules. The arrow only ever points this way,
# so deleting this crate leaves a complete, playable-by-machine match.
[package]
name = "gameplayfootball_presentation"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.97"
version = "0.1.0"

[lib]
name = "football_presentation"

[dependencies]
football_domain = { package = "gameplayfootball_domain", path = "../domain" }

bevy = { version = "0.19", features = ["android-native-activity", "debug", "wav"] }

# Ley 10: lo que puede ser un error de compilación, lo es. No se heredan del
# workspace porque es compartido con otros proyectos.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
# El RNG y el reloj convierten enteros a f32 a propósito.
cast_precision_loss = "allow"
