# Domain: types, units, rules, facts, intents and configuration.
#
# Depends on no engine subsystem beyond ECS data and maths. It cannot see
# rendering, windowing or assets, so a rule can never be expressed in terms of
# a mesh or a material (architecture law 1).
[package]
name = "gameplayfootball_domain"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.97"
version = "0.1.0"

# Short import path, as required by the workspace naming rule: the package is
# prefixed with the project slug, the library keeps the layer's name.
[lib]
name = "football_domain"

[dependencies]
# `bevy_reflect` on the ECS and maths crates is what makes domain types
# introspectable (`Entity`, `Vec3`, `Quat` inside a `#[derive(Reflect)]`), which
# the diagnostic overlays and future scenario serialization rely on.
bevy_ecs = { version = "0.19", features = ["bevy_reflect"] }
bevy_math = { version = "0.19", features = ["bevy_reflect", "serialize"] }
bevy_reflect = "0.19"
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Ley 10: lo que puede ser un error de compilación, lo es. No se heredan del
# workspace porque es compartido con otros proyectos.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
# El RNG y el reloj convierten enteros a f32 a propósito.
cast_precision_loss = "allow"
