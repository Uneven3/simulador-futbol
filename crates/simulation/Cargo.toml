# Simulation: the authoritative ECS kernel — physics, decision, tactics,
# refereeing and telemetry.
#
# It depends on ECS, maths, time and logging, and deliberately NOT on `bevy`
# itself: without `bevy_render`, `bevy_pbr` or `bevy_asset` in scope, a mesh or
# material cannot be built here even by accident. Architecture law 1 is enforced
# by Cargo, not by review.
[package]
name = "gameplayfootball_simulation"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.97"
version = "0.1.0"

[lib]
name = "football_simulation"

[dependencies]
football_domain = { package = "gameplayfootball_domain", path = "../domain" }

bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_log = "0.19"
bevy_math = "0.19"
bevy_time = "0.19"

# Ley 10: lo que puede ser un error de compilación, lo es. No se heredan del
# workspace porque es compartido con otros proyectos.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
# El RNG y el reloj convierten enteros a f32 a propósito.
cast_precision_loss = "allow"
