# App: composition, scenario and lifecycle. It wires the layers together and
# owns nothing else; the crates below never reach back up to it.
#
# Nothing here is inherited from a workspace: the project is a member of the
# shared `uneven` workspace when it sits inside it, and its own workspace root
# (with `crates/*` pulled in as path dependencies) when the repository is
# cloned on its own. Inheriting would make the standalone clone fail to build.
[package]
name = "gameplayfootball"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.97"
version = "0.1.0"

# Ni `src/lib.rs` ni el binario tienen un solo `#[test]` dentro: lo que se afirma
# sobre esta capa vive en `tests/`. Sin esto cargo construye, enlaza y ejecuta
# dos binarios de prueba —1,7 GB cada uno, porque enlazan Bevy entero— para
# correr cero tests.
[lib]
test = false

[[bin]]
name = "gameplayfootball"
path = "src/main.rs"
test = false

[dependencies]
football_domain = { package = "gameplayfootball_domain", path = "crates/domain" }
football_presentation = { package = "gameplayfootball_presentation", path = "crates/presentation" }
football_simulation = { package = "gameplayfootball_simulation", path = "crates/simulation" }

bevy = { version = "0.19", features = ["android-native-activity", "debug", "wav"] }

[features]
dev = ["bevy/dynamic_linking"]

# Ley 10: lo que puede ser un error de compilación, lo es. No se heredan del
# workspace porque es compartido con otros proyectos.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
# El RNG y el reloj convierten enteros a f32 a propósito.
cast_precision_loss = "allow"
