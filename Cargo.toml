# App: composition, scenario and lifecycle. It wires the layers together and
# owns nothing else; the crates below never reach back up to it.
#
# Nothing here is inherited from a workspace: the project is a member of the
# shared `uneven` workspace when it sits inside it, and its own workspace root
# (with `crates/*` pulled in as path dependencies) when the repository is
# cloned on its own. Inheriting would make the standalone clone fail to build.
[package]
name = "gameplayfootball"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.97"
version = "0.1.0"

[dependencies]
football_domain = { package = "gameplayfootball_domain", path = "crates/domain" }
football_presentation = { package = "gameplayfootball_presentation", path = "crates/presentation" }
football_simulation = { package = "gameplayfootball_simulation", path = "crates/simulation" }

bevy = { version = "0.19", features = ["android-native-activity", "debug", "wav"] }
